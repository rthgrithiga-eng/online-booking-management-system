# ===================================================================
# Online Booking Management System - Application Configuration
# ===================================================================

# Application & Server Details
spring.application.name=online-booking-system
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------------------
# Database Name: online_booking_db
# DB_USERNAME defaults to root if not specified.
# DB_PASSWORD is required and must be provided via environment variable or system property.
spring.datasource.url=jdbc:mysql://localhost:3306/online_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# -------------------------------------------------------------------
# ddl-auto=update will automatically create or update tables matching Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Jackson Date/Time Serialization (ISO-8601 formatting)
# -------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false

# -------------------------------------------------------------------
# JWT Security Configuration
# -------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

